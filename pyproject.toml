[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mindrepo"
version = "0.1.0"
description = "Personal developer knowledge base and review system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "psycopg[binary]>=3.2,<3.3",
    "python-dotenv>=1.0,<2.0",
    "gunicorn>=23,<24",
]

[dependency-groups]
dev = [
    "ruff>=0.12,<0.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["apps*", "config*"]
