name: CI
on: [push, pull_request]
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check
      - run: uv run python manage.py test
      - run: uv run ruff check .
      - run: uv lock --check
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: mindrepo, POSTGRES_USER: mindrepo, POSTGRES_PASSWORD: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mindrepo" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://mindrepo:test@localhost:5432/mindrepo
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run python manage.py migrate
      - run: uv run python manage.py test
