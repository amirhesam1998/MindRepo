{% load mindrepo_i18n %}<form method="post" action="{% url 'knowledge:concept_favorite' concept.pk concept.slug %}" class="favorite-control" hx-post="{% url 'knowledge:concept_favorite' concept.pk concept.slug %}" hx-target="this" hx-swap="outerHTML">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button type="submit" class="favorite-button{% if concept.is_favorite %} is-favorite{% endif %}" aria-label="{% if concept.is_favorite %}{{ 'Remove from favorites'|tr }}{% else %}{{ 'Add to favorites'|tr }}{% endif %}" aria-pressed="{{ concept.is_favorite|yesno:'true,false' }}" title="{% if concept.is_favorite %}{{ 'Remove from favorites'|tr }}{% else %}{{ 'Add to favorites'|tr }}{% endif %}"><span aria-hidden="true">{% if concept.is_favorite %}★{% else %}☆{% endif %}</span><span class="visually-hidden">{% if concept.is_favorite %}{{ "Favorite"|tr }}{% else %}{{ "Not favorite"|tr }}{% endif %}</span></button></form>
